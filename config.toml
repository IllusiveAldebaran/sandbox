base_url = "https://salif.github.io/zola-themes-collection/demo/sandbox/"
title = "Zola Sandbox"
description = "This repository is used to test new web elements. It is an amalgamation of code snippets, all weaved together by Zola."

compile_sass = true
# generate_feed = false
minify_html = false
build_search_index = false

author = "Miguel Pimentel"
taxonomies = [
  { name = "categories", feed = false },
  { name = "tags", feed = false },
]

[markdown]
highlight_code = true
# highlight_theme = "ayu-light"

[extra]
# KaTeX math rendering, ported from the zola-pickles theme. Use the `katex`
# component in Markdown content to add math, e.g. {% katex() %}x^2{% end %}.
katex_enable = true
internalLinks = [
  { url = "about", name = "About" },
  { url = "posts", name = "Posts" },
  { url = "projects", name = "Projects" },
]
externalLinks = [
  { url = "https://github.com/salif/sandbox", name = "GitHub" },
]
