name = "Sandbox"
description = "Sandbox is a theme for Zola."
license = "MIT"
homepage = "https://github.com/salif/sandbox"
min_version = "0.18.0"
demo = "https://salif.github.io/zola-themes-collection/demo/sandbox/"
tags = ["Blog"]

[author]
name = "Miguel Pimentel"
homepage = "https://miguelpimentel.do/"

# Any variable here can be overridden by a site's own zola.toml [extra] table.
[extra]
# KaTeX math rendering, ported from the zola-pickles theme. Use the `katex`
# component in Markdown content to add math, e.g. {% katex() %}x^2{% end %}.
katex_enable = false

# Pagefind site search, ported from the zola-pickles theme. Requires a
# `pagefind --site <output dir>` step after `zola build`; see config.toml.
search_enable = false
